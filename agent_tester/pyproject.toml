[project]
name = "agent-tester"
version = "0.1.0"
description = "Agent tester for MBPP and SWE-bench evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "docker>=7.0.0",
    "fire>=0.7.1",
    "mcp[cli]>=1.22.0",
    "pytest>=8.0.0",
    "swebench>=4.1.0",
    "pydantic>=2.0.0",
    "colorama>=0.4.6",
    "chardet<6",
]

[project.scripts]
agent_tester_swebench = "agent_tester.swebench.interact:_fire_main"
agent_tester_mbpp = "agent_tester.mbpp.interact:_fire_main"
agent_tester_eval = "agent_tester.__main__:main"
agent_tester = "agent_tester.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_tester"]
